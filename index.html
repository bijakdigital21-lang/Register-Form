<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <!-- Sekat auto-zoom pada peranti mudah alih -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pendaftaran Pengguna Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f4f4f9;
      margin: 0;
      /* Mencegah pergerakan melampau pada skrin */
      touch-action: manipulation;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    input[type="email"] {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      /* Font minimal 16px untuk elak browser auto-zoom bila tekan input */
      font-size: 16px; 
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #message {
      margin-top: 15px;
      font-size: 14px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Daftar Pengguna</h2>
    <form id="registerForm">
      <div class="form-group">
        <label for="email">Emel Pengguna:</label>
        <input type="email" id="email" placeholder="contoh@domain.com" required>
      </div>
      <button type="submit" id="btnRegister">Register</button>
    </form>
    <div id="message"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDXc06B8WLtqjkG0aScBHrd3L3M-n_5okc",
      authDomain: "grammar-hub-6af80.firebaseapp.com",
      databaseURL: "https://grammar-hub-6af80-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grammar-hub-6af80",
      storageBucket: "grammar-hub-6af80.firebasestorage.app",
      messagingSenderId: "1092171234032",
      appId: "1:1092171234032:web:7cc8efefb812993500e035"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const defaultPassword = "GH548267ie";
    const form = document.getElementById('registerForm');
    const messageDiv = document.getElementById('message');
    const btnRegister = document.getElementById('btnRegister');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      messageDiv.style.color = "blue";
      messageDiv.textContent = "Sedang mendaftar...";
      btnRegister.disabled = true;

      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, defaultPassword);
        const user = userCredential.user;
        
        messageDiv.style.color = "green";
        messageDiv.textContent = `Pengguna berjaya didaftarkan! (UID: ${user.uid})`;
        form.reset();
      } catch (error) {
        messageDiv.style.color = "red";
        messageDiv.textContent = `Ralat: ${error.message}`;
      } finally {
        btnRegister.disabled = false;
      }
    });
  </script>
</body>
</html>
